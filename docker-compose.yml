services:

  # ────────────────────────────────────────────────────────────
  # BFF — Backend for Frontend
  # ────────────────────────────────────────────────────────────
  bff:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      # Aponta a API externa para o WireMock que sobe neste compose
      EXTERNAL_APIS_EXAMPLE_API_BASE_URL: http://example-api-mock:8080
      EXTERNAL_APIS_EXAMPLE_API_TIMEOUT: 5s
    depends_on:
      - example-api-mock
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ────────────────────────────────────────────────────────────
  # Mock da API externa — WireMock
  # Responde ao endpoint GET /examples/{id} que o ExampleApiClient chama.
  # Os stubs ficam em wiremock/mappings/ e os bodies em wiremock/__files/.
  # ────────────────────────────────────────────────────────────
  example-api-mock:
    image: wiremock/wiremock:3.9.2
    ports:
      - "9090:8080"
    volumes:
      - ./wiremock/mappings:/home/wiremock/mappings:ro
      - ./wiremock/__files:/home/wiremock/__files:ro
    command: ["--verbose"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/__admin/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
